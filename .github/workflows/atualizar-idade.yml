name: Atualizar idade no terminal

on:
  schedule:
    # Todo dia as 03:05 UTC (00:05 em Sao Paulo)
    - cron: "5 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      # O GitHub desativa workflows agendados apos 60 dias sem atividade.
      # Como o SVG so muda uma vez por ano, reativamos o workflow a cada
      # execucao para o agendamento nunca ser desligado.
      - name: Manter o agendamento ativo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable atualizar-idade.yml

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar terminal.svg
        run: python .github/scripts/gerar_terminal.py

      - name: Commit apenas se o SVG mudou
        run: |
          if git diff --quiet -- terminal.svg; then
            echo "Nada mudou, nenhum commit necessario."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add terminal.svg
            git commit -m "Atualiza idade no terminal"
            git push
          fi
